version: "3.8"

services:
  db:
    image: mariadb:10.11
    container_name: glpi-database
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - data:/var/lib/mysql
    networks:
      - glpi-net

  glpi-php:
    image: mnp-glpi:10.0.19
    restart: unless-stopped
    container_name: glpi-php
    depends_on:
      - db
    ports:
      - "${LISTEN_PORT}:80"
    volumes:
      - glpi-files:/var/www/html/glpi/files
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_NAME: ${MYSQL_DATABASE}
      GLPI_DB_USER: ${MYSQL_USER}
      GLPI_DB_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - glpi-net

volumes:
  data:
  glpi-files:

networks:
  glpi-net:
